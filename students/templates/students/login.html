<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/static/css/sis-premium.css">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Student Information System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(129, 255, 229, 0.22), transparent 20%),
                radial-gradient(circle at bottom right, rgba(200,242,61,0.16), transparent 25%),
                linear-gradient(135deg, #050b0a 0%, #0b1716 24%, #0d241d 58%, #0d1714 100%);
            color: #f3f7f4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -15% -10% auto auto;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(199,255,73,0.18), transparent 65%);
            filter: blur(10px);
            pointer-events: none;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 30px 60px;
            background: linear-gradient(135deg, rgba(8,15,13,0.34), rgba(12,33,29,0.1));
            position: relative;
            z-index: 1;
        }

        .login-card {
            width: 100%;
            max-width: 820px;
            background: rgba(16, 34, 29, 0.6);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 32px;
            padding: 54px 72px 48px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .logo {
            width: 82px;
            height: 82px;
            border-radius: 22px;
            background: linear-gradient(135deg, #d6ff67, #b8e61a);
            color: #0d1f1b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 38px;
            box-shadow: 0 16px 36px rgba(184, 230, 26, 0.25);
        }

        h1 {
            font-size: clamp(2.4rem, 4vw, 3.5rem);
            line-height: 1.08;
            margin-bottom: 14px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #f7faf7;
        }

        .subtitle {
            color: #b7c9c0;
            font-size: 1.1rem;
            margin-bottom: 46px;
            letter-spacing: 0.02em;
        }

        .field {

            margin-bottom: 32px;

        }

        label {

            display: block;

            font-size: 22px;

            margin-bottom: 12px;

            color: #e3e9e5;

        }

        input {
            width: 100%;
            height: 70px;
            padding: 0 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(8,14,13,0.42);
            color: #ffffff;
            font-size: 1.05rem;
            outline: none;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #8a9c95;
        }

        input:focus {
            border-color: #c8f23d;
            box-shadow: 0 0 0 4px rgba(200,242,61,0.12);
        }

        .error {
            background: rgba(190, 55, 55, 0.18);
            border: 1px solid rgba(255, 100, 100, 0.35);
            color: #ffb5b5;
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.96rem;
        }

        .signin-button {
            width: 100%;
            height: 72px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #d9ff63, #bfe728);
            color: #122921;
            font-size: 1.12rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 26px rgba(191, 231, 40, 0.28);
        }

        .signin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 30px rgba(191, 231, 40, 0.32);
        }

        /* =================================================
           REGISTRATION
        ================================================= */

        .register-area {

            margin-top: 35px;

            padding-top: 30px;

            border-top: 1px solid
                rgba(255,255,255,0.12);

            text-align: center;

        }

        .register-text {

            color: #aebcb5;

            font-size: 18px;

            margin-bottom: 14px;

        }

        .register-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 250px;

            padding: 14px 25px;

            border-radius: 12px;

            background: transparent;

            border: 2px solid #c8f23d;

            color: #c8f23d;

            text-decoration: none;

            font-size: 18px;

            font-weight: 700;

            transition: 0.2s;

        }

        .register-button:hover {

            background: #c8f23d;

            color: #17382b;

        }

        .footer {

            text-align: center;

            margin-top: 40px;

            color: #8f9e96;

            font-size: 17px;

        }

        @media(max-width: 700px) {

            .page {

                padding: 15px;

            }

            .login-card {

                padding: 40px 25px;

                border-radius: 20px;

            }

            h1 {

                font-size: 38px;

            }

            .subtitle {

                font-size: 19px;

                margin-bottom: 40px;

            }

            label {

                font-size: 18px;

            }

            input {

                height: 65px;

                font-size: 18px;

            }

            .signin-button {

                height: 65px;

                font-size: 21px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">

            SIS

        </div>


        <!-- TITLE -->

        <h1>

            Student Information System

        </h1>


        <p class="subtitle">

            Secure access to your academic portal

        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{% url 'login' %}"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="field">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- SIGN IN -->

            <button
                type="submit"
                class="signin-button"
            >

                Sign In

            </button>


        </form>


        <!-- =================================================
             STUDENT REGISTRATION
        ================================================== -->

        <div class="register-area">

            <div class="register-text">

                New student?

            </div>


            <a
                href="{% url 'student_register' %}"
                class="register-button"
            >

                Register as Student

            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            Cloud-Based Student Information Management System

        </div>


    </div>


</div>


</body>

</html>
