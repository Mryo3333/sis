<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/css/sis-premium.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices | SIS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(180deg,#edf8f3,#f7faf9 100%); color:#163a31; }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px 60px; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 24px; }
        .header h1 { font-size: clamp(2rem,4vw,3rem); letter-spacing:-0.06em; }
        .toolbar a { text-decoration:none; background: linear-gradient(135deg,#dcff7c,#bce63d); color:#112f29; font-weight:800; padding: 12px 18px; border-radius: 12px; }
        .panel { background: rgba(255,255,255,.8); border:1px solid rgba(18,49,40,.08); border-radius: 24px; padding: 22px; box-shadow: 0 12px 26px rgba(14,35,28,.05); margin-bottom: 24px; }
        form.grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
        label { display:block; font-weight:700; margin-bottom:8px; }
        input, select, textarea { width:100%; padding: 12px 14px; border:1px solid #d9e1d8; border-radius: 12px; font: inherit; background: #f8fbf9; }
        textarea { min-height:120px; resize: vertical; }
        .full { grid-column: 1 / -1; }
        button { margin-top: 8px; border: none; background: linear-gradient(135deg,#d8ff68,#bce537); color:#15362c; font-weight:800; padding: 12px 18px; border-radius: 12px; cursor: pointer; }
        table { width:100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #e4ebe6; text-align: left; }
        th { color:#64806d; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; }
        .delete { background:#1a3a36; color:#fff; border:none; border-radius:10px; padding: 8px 12px; font-weight:700; cursor:pointer; }
        @media (max-width: 760px) { form.grid { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Manage Notices</h1>
            <div class="toolbar">
                <a href="{% url 'dashboard' %}">Back to dashboard</a>
            </div>
        </div>

        <div class="panel">
            <form method="post">
                {% csrf_token %}
                <div class="grid">
                    <div class="full"><label>Title</label><input type="text" name="title" required></div>
                    <div><label>Category</label><select name="category"><option>Academic</option><option>Examination</option><option>Fees</option><option>Event</option><option>General</option></select></div>
                    <div><label>Audience</label><select name="audience"><option>All</option><option>Admin</option><option>Teacher</option><option>Student</option><option>Parent</option></select></div>
                    <div class="full"><label>Message</label><textarea name="content" required></textarea></div>
                </div>
                <button type="submit">Publish Notice</button>
            </form>
        </div>

        <div class="panel">
            <table>
                <thead>
                    <tr><th>Title</th><th>Category</th><th>Audience</th><th>Published</th><th>Action</th></tr>
                </thead>
                <tbody>
                    {% for notice in notices %}
                    <tr>
                        <td>{{ notice.title }}</td>
                        <td>{{ notice.category }}</td>
                        <td>{{ notice.audience }}</td>
                        <td>{{ notice.published_at|date:'d M Y' }}</td>
                        <td>
                            <form method="post" action="{% url 'admin_delete_notice' notice.notice_id %}">
                                {% csrf_token %}
                                <button class="delete" type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="5">No notices created yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
