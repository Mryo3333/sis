services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudcampus}
      POSTGRES_USER: ${POSTGRES_USER:-cloudcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DEBUG: ${DEBUG:-False}
      FORCE_HTTPS: ${FORCE_HTTPS:-False}
      SECRET_KEY: ${SECRET_KEY:-replace-this-secret-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-cloudcampus}
      DB_USER: ${POSTGRES_USER:-cloudcampus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      DB_HOST: db
      DB_PORT: 5432
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}

volumes:
  postgres_data:
