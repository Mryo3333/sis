services:
  - type: web
    name: sis
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: FORCE_HTTPS
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: sis.onrender.com,localhost,127.0.0.1
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: cloud-campus-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cloud-campus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloud-campus-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: cloud-campus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloud-campus-db
          property: port
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sis.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: cloud-campus-db
    databaseName: cloudcampus
    user: cloudcampus
    plan: free
